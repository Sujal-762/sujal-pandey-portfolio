<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found – Sujal Pandey</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0909">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.25rem;
      background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(60,100,150,.16), transparent 70%), #0a0909;
      color: #ece7dc; font: 1rem/1.6 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 34rem; }
    .tag {
      display: inline-block; padding: .35rem .8rem; margin: 0 0 1.5rem;
      font: 500 .72rem/1.4 ui-monospace, Consolas, monospace; letter-spacing: .16em; text-transform: uppercase;
      color: #d9534a; background: rgba(217,83,74,.1);
    }
    h1 { margin: 0 0 .75rem; font: 400 clamp(2.6rem, 9vw, 4rem)/1 "Instrument Serif", Georgia, serif; }
    p { color: #a9adb5; margin: 0 0 2rem; }
    a {
      display: inline-flex; align-items: center; min-height: 48px; padding: 0 1.4rem;
      background: #ece7dc; color: #0a0909; text-decoration: none; font-weight: 500; border-radius: 2px;
    }
    a:hover { background: #6cc7d4; }
    a:focus-visible { outline: 2px solid #6cc7d4; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="tag">Error 404 · File not found</p>
    <h1>Page not found</h1>
    <p>The page you were looking for doesn't exist or has moved.</p>
    <a href="/">Back to the portfolio</a>
  </main>
</body>
</html>
